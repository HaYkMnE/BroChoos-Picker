name: Bug report
description: Something in BroChoos Picker does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste full URLs, file paths or profile names that you consider private.
        For security problems, use SECURITY.md instead of this form.
  - type: input
    id: version
    attributes:
      label: BroChoos Picker version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - winget
        - Scoop
        - Installer (.exe)
        - Portable (.zip)
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` and copy the version and build.
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: input
    id: browsers
    attributes:
      label: Browsers involved
      placeholder: "Chrome stable with 3 profiles, Firefox Nightly"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click a link in ...
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Problem log (optional)
      description: |
        Relevant lines from `%LocalAppData%\BroChoos\logs\problems.log`. This file contains no URLs, paths or user names.
        Output of `BroChoos.exe --verify-defaults` also helps with default-browser issues.
      render: text
