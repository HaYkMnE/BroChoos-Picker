name: Feature request
description: Suggest an idea for BroChoos Picker.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      placeholder: "When I click a Teams link, I always want it to open in my work Edge profile."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like BroChoos Picker to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
