name: Release

# Builds the public release of BroChoos Picker.
#   push of a tag vX.Y.Z  -> verify, build, attest, and publish a GitHub Release for that tag.
#   workflow_dispatch     -> verify and build only (a dry run). Nothing is published; the built
#                            files are kept as a workflow artifact for inspection.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, X.Y.Z (dry run, nothing is published)'
        required: true
        type: string

permissions:
  contents: read

# One run per ref; a release run is never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs with the tag in a trailing comment, as in ci.yml.
# Each SHA is the commit the named tag pointed to in the GitHub API on 2026-10-29.
jobs:
  # The single source of truth for the version: the tag (vX.Y.Z -> X.Y.Z), or the dispatch input.
  # Every later step reads needs.version.outputs.version; nothing else defines a version.
  version:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Derive version
        id: derive
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tags must look like v1.2.3; got '$env:GITHUB_REF_NAME'."
            }
            $version = $Matches[1]
          }
          else {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw "The version input must look like 1.2.3; got '$env:INPUT_VERSION'."
            }
            $version = $env:INPUT_VERSION
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Release version: $version"

  # Same restore/build/test commands as the CI test job.
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Fail closed: the winget LicenseUrl links blob/v<version>/LICENSE and the package is
      # declared MIT, so a tag without the MIT LICENSE at the repository root must not ship.
      - name: Check LICENSE (MIT, repository root)
        shell: powershell
        env:
          LICENSE_PATH: LICENSE
          LICENSE_FIRST_LINE: MIT License
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:LICENSE_PATH -PathType Leaf)) {
            throw "$env:LICENSE_PATH is missing at the repository root; merge it before tagging a release."
          }
          $first = @(Get-Content -LiteralPath $env:LICENSE_PATH -TotalCount 1)
          $firstLine = if ($first.Count -gt 0) { ([string]$first[0]).Trim([char]0xFEFF).Trim() } else { '' }
          if ($firstLine -ne $env:LICENSE_FIRST_LINE) {
            throw "$env:LICENSE_PATH first line is '$firstLine', expected '$env:LICENSE_FIRST_LINE'."
          }
          Write-Host "$env:LICENSE_PATH OK: $firstLine"
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BroChoos.sln
      - name: Build
        run: dotnet build BroChoos.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BroChoos.sln --configuration Release --no-build --verbosity normal

  build:
    needs: [version, verify]
    runs-on: windows-2022
    timeout-minutes: 40
    # Same pinned toolchain as ci.yml (powershell-tests); see the comment there.
    env:
      INNO_SETUP_VERSION: '6.7.2'
      INNO_SETUP_URL: 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_2/innosetup-6.7.2.exe'
      INNO_SETUP_SHA256: '9F27F8386E554EB093336A1CA5C2DCACB7DBF04AB020889491D7AC53C38A12FF'
      INNO_SETUP_SIGNER_THUMBPRINT: 'E0AB19C8D38CBF9C44709925122A7A02F8C70CB7'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Identical to the ci.yml step of the same name.
      - name: Install Inno Setup (pinned, hash + signer verified)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $env:INNO_SETUP_URL -OutFile $setup

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup SHA-256 mismatch: expected $env:INNO_SETUP_SHA256, got $hash"
          }

          $sig = Get-AuthenticodeSignature -LiteralPath $setup
          if ($sig.Status -ne 'Valid') { throw "Inno Setup setup signature status is '$($sig.Status)', expected Valid" }
          if ($sig.SignerCertificate.Thumbprint -ne $env:INNO_SETUP_SIGNER_THUMBPRINT) {
            throw "Inno Setup signer thumbprint '$($sig.SignerCertificate.Thumbprint)' is not the allowlisted $env:INNO_SETUP_SIGNER_THUMBPRINT"
          }
          Write-Host "Verified $setup sha256=$hash signer='$($sig.SignerCertificate.Subject)'"

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6'
          $log = Join-Path $env:RUNNER_TEMP 'innosetup-install.log'
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /CURRENTUSER /DIR=`"$installDir`" /LOG=`"$log`""
          $proc = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Write-Host }
            throw "Inno Setup installer exited with $($proc.ExitCode)"
          }

          $entry = Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1' -ErrorAction SilentlyContinue
          if ($null -eq $entry -or $entry.DisplayVersion -ne $env:INNO_SETUP_VERSION) {
            throw "HKCU 'Inno Setup 6_is1' DisplayVersion is '$($entry.DisplayVersion)', expected $env:INNO_SETUP_VERSION"
          }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe not found at $iscc" }
          $isccSig = Get-AuthenticodeSignature -LiteralPath $iscc
          if ($isccSig.Status -ne 'Valid' -or $isccSig.SignerCertificate.Thumbprint -ne $env:INNO_SETUP_SIGNER_THUMBPRINT) {
            throw "Installed ISCC.exe signature check failed (status '$($isccSig.Status)')"
          }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDir
          Write-Host "Inno Setup $($entry.DisplayVersion) installed per-user at $installDir"
      # Self-contained publish -> Inno installer -> self-contained smoke runs -> portable zip ->
      # SHA256SUMS.txt. The same script is used for local dry runs.
      - name: Build release files
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-release.ps1 -Version $env:RELEASE_VERSION -OutputDir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ runner.temp }}/release/BroChoos-Picker-Setup-*-x64.exe
            ${{ runner.temp }}/release/BroChoos-Picker-*-x64-portable.zip
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs
          path: ${{ runner.temp }}/release/logs
          if-no-files-found: ignore
          retention-days: 14

  # The only job with write access, and it only runs for a pushed tag.
  release:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The job holds contents: write; nothing here runs git, so the token is not left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Check files against SHA256SUMS.txt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            "BroChoos-Picker-Setup-$env:RELEASE_VERSION-x64.exe",
            "BroChoos-Picker-$env:RELEASE_VERSION-x64-portable.zip"
          )
          $lines = @(Get-Content -LiteralPath 'dist/SHA256SUMS.txt' | Where-Object { $_ -ne '' })
          if ($lines.Count -ne $expected.Count) { throw "SHA256SUMS.txt has $($lines.Count) entries, expected $($expected.Count)." }
          foreach ($line in $lines) {
            $hash, $name = $line -split '  ', 2
            if ($expected -notcontains $name) { throw "Unexpected file in SHA256SUMS.txt: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'dist' $name)).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "SHA-256 mismatch for $name" }
            Write-Host "OK $name $hash"
          }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/extract-changelog-notes.ps1 -Version $env:RELEASE_VERSION -OutFile dist/release-notes.md -Repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "dist/BroChoos-Picker-Setup-$env:RELEASE_VERSION-x64.exe",
            "dist/BroChoos-Picker-$env:RELEASE_VERSION-x64-portable.zip",
            'dist/SHA256SUMS.txt'
          )
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "BroChoos Picker $env:RELEASE_VERSION" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
